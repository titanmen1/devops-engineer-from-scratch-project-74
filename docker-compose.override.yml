services:
  app:
    # Своё имя образа: иначе dev-сборка подменяется продакшен-образом из
    # docker-compose.yml вместе с его NODE_ENV=production, и npm пропускает
    # devDependencies, без которых не стартует сборка фронтенда
    image: titanmen/devops-engineer-from-scratch-project-74-development
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ./app:/app
    ports:
      - "8080:8080"
    command: make dev

  caddy:
    image: caddy:latest
    volumes:
      - ./services/caddy/Caddyfile:/etc/caddy/Caddyfile
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - app
