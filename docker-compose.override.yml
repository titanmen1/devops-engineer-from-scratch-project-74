services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ./app:/app
    ports:
      - "8080:8080"
    # NODE_ENV сбрасывается явно: dev-сервис делит имя образа с продакшеном, и
    # без этого npm видит production, пропускает devDependencies, а сборка
    # фронтенда падает на отсутствующем vite
    environment:
      NODE_ENV: development
    command: make dev

  caddy:
    image: caddy:latest
    volumes:
      - ./services/caddy/Caddyfile:/etc/caddy/Caddyfile
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - app
