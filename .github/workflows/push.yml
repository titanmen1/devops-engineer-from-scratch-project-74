name: push

on:
  push:
    branches:
      - master

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run tests
        run: make ci

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.production
          push: true
          # Проверки Хекслета идут на amd64-раннере, разработка бывает на arm64:
          # образ под одну платформу ломает вторую с "no matching manifest"
          platforms: linux/amd64,linux/arm64
          tags: |
            titanmen/devops-engineer-from-scratch-project-74:latest
            titanmen/devops-engineer-from-scratch-project-74:${{ github.sha }}
